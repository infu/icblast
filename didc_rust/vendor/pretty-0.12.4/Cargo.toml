[package]
name = "pretty"
version = "0.12.4"
authors = [
  "Jonathan Sterling <jon@jonmsterling.com>",
  "Darin Morrison <darinmorrison+git@gmail.com>",
  "Markus Westerlind <marwes91@gmail.com>",
]
description = "Wadler-style pretty-printing combinators in Rust"
documentation = "https://docs.rs/pretty/"
keywords = ["console", "functional", "pretty-printing"]
license = "MIT"
repository = "https://github.com/Marwes/pretty.rs"
edition = "2018"
publish = false

[package.metadata.docs.rs]
features = ["termcolor"]

[dependencies]
arrayvec = "0.5"
typed-arena = "2.0.0"
termcolor = { version = "1.1.0", optional = true }
unicode-width = "0.1"
