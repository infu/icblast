# Adapted from the Apache-2.0 Candid wasm-bindgen example manifest.
# Modified by icblast to pin package metadata, WebAssembly randomness support,
# dependencies, and the non-publication policy for this source crate.

[package]
name = "didc_rust"
version = "0.1.0"
edition = "2021"
description = "Local Candid binding generator embedded by icblast"
license = "Apache-2.0"
repository = "https://github.com/infu/icblast"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
candid_parser = "0.1"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"

[patch.crates-io]
# pretty 0.12.4 builds long Candid services as a left-deep document tree,
# whose recursive Rc drop overflows the WebAssembly call stack. This exact
# vendored release changes only concatenation shape; see its PATCH.md.
pretty = { path = "vendor/pretty-0.12.4" }
